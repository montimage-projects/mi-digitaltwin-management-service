name: Documentation Required Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check-docs-updated:
    name: Verify Documentation Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            client/src/**
            server/src/**
            package.json

      - name: Check if docs updated when code changed
        env:
          CODE_CHANGED: ${{ steps.changed-files.outputs.all_changed_files }}
          DOCS_CHANGED: ${{ steps.changed-files.outputs.other_changed_files }}
        run: |
          # Get list of changed files in code
          code_changed="$CODE_CHANGED"

          if [ -z "$code_changed" ]; then
            echo " No code changes detected"
            exit 0
          fi

          # Check if documentation was changed
          docs_changed="$DOCS_CHANGED"

          # List of patterns that suggest docs should be updated
          code_patterns=(
            "client/src/routes"
            "server/src/routes"
            "client/src/components"
            "client/src/hooks"
            "server/src/models"
          )

          needs_docs=false
          for file in $code_changed; do
            for pattern in "${code_patterns[@]}"; do
              if [[ "$file" == *"$pattern"* ]]; then
                needs_docs=true
                echo "  API or component change detected: $file"
                break
              fi
            done
          done

          if [ "$needs_docs" = true ]; then
            # Check if any documentation files were updated
            has_docs_update=false

            if [[ "$docs_changed" == *"docs/"* ]] || \
               [[ "$docs_changed" == *"README.md"* ]] || \
               [[ "$docs_changed" == *"API.md"* ]] || \
               [[ "$docs_changed" == *"COMPONENTS.md"* ]]; then
              has_docs_update=true
            fi

            if [ "$has_docs_update" = true ]; then
              echo " Documentation has been updated"
              exit 0
            else
              echo "  Code changes detected but no documentation updates found"
              echo ""
              echo " When modifying code, please also update relevant documentation:"
              echo "   • docs/API.md - If API endpoints changed"
              echo "   • docs/COMPONENTS.md - If components changed"
              echo "   • docs/DEVELOPMENT.md - If setup/workflow changed"
              echo "   • README.md or relevant guide - If architecture changed"
              echo ""
              echo "This is a reminder, not a blocker. But please consider updating docs!"
            fi
          else
            echo " No code changes requiring documentation updates"
            exit 0
          fi

  check-api-documentation:
    name: API Documentation Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed API routes
        id: changed-routes
        uses: tj-actions/changed-files@v41
        with:
          files: |
            server/src/routes/**

      - name: Verify API docs updated
        if: steps.changed-routes.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-routes.outputs.all_changed_files }}
        run: |
          changed_files="$CHANGED_FILES"

          echo " Changed API route files:"
          echo "$changed_files"
          echo ""

          # Check if docs/API.md was modified
          if git diff --name-only HEAD~1 | grep -q "docs/API.md"; then
            echo " API documentation (docs/API.md) has been updated"
            exit 0
          else
            echo "  API routes changed but docs/API.md not updated"
            echo ""
            echo " Please update docs/API.md with any new/modified endpoints"
            echo "   Include:"
            echo "   • HTTP method and path"
            echo "   • Request parameters and body"
            echo "   • Response format"
            echo "   • Error codes"
            echo "   • Example curl command"
          fi

  check-component-documentation:
    name: Component Documentation Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed components
        id: changed-components
        uses: tj-actions/changed-files@v41
        with:
          files: |
            client/src/components/**

      - name: Verify component docs updated
        if: steps.changed-components.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-components.outputs.all_changed_files }}
        run: |
          changed_files="$CHANGED_FILES"

          # Count number of component files changed
          component_count=$(echo "$changed_files" | wc -l)

          if [ $component_count -gt 0 ]; then
            echo " Changed $component_count component file(s)"

            # Check if docs/COMPONENTS.md was modified
            if git diff --name-only HEAD~1 | grep -q "docs/COMPONENTS.md"; then
              echo " Component documentation (docs/COMPONENTS.md) has been updated"
              exit 0
            else
              echo "  Component files changed but docs/COMPONENTS.md not updated"
              echo ""
              echo " Please update docs/COMPONENTS.md with:"
              echo "   • New component props and interfaces"
              echo "   • Usage examples"
              echo "   • Component behavior changes"
            fi
          fi

  documentation-pr-comment:
    name: Add PR Comment with Documentation Links
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `##  Documentation Reference

            Thank you for your pull request! Here are the key documentation resources:

            ### Documentation Updates
            When making code changes, please update relevant documentation:
            - **API Changes** → [\`docs/API.md\`](https://github.com/${{ github.repository }}/blob/main/docs/API.md)
            - **Component Changes** → [\`docs/COMPONENTS.md\`](https://github.com/${{ github.repository }}/blob/main/docs/COMPONENTS.md)
            - **Setup/Workflow Changes** → [\`docs/DEVELOPMENT.md\`](https://github.com/${{ github.repository }}/blob/main/docs/DEVELOPMENT.md)
            - **Architecture Changes** → [\`docs/architecture/\`](https://github.com/${{ github.repository }}/tree/main/docs/architecture)

            ### Documentation Guides
            -  [Development Guide](https://github.com/${{ github.repository }}/blob/main/docs/DEVELOPMENT.md)
            -  [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT.md)
            -  [API Reference](https://github.com/${{ github.repository }}/blob/main/docs/API.md)
            -  [Component Reference](https://github.com/${{ github.repository }}/blob/main/docs/COMPONENTS.md)
            -  [Documentation Index](https://github.com/${{ github.repository }}/blob/main/docs/README.md)

            **Note:** Always ensure documentation reflects your code changes for future maintainability!`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

# Local deployment override for docker-compose.prod.yml.
# The original prod volume (montimage-mongodb-data-prod) was written by mongo:7
# and is refused by the mongo:8 image — it is preserved untouched for manual
# recovery; this stack uses a fresh volume so the init script runs once with
# the credentials from .env.prod.
services:
  app:
    environment:
      # init-mongo.js creates intact_app in the `intact` db; the prod file's
      # ?authSource=admin looks for it in `admin` and always fails.
      MONGODB_URI: mongodb://intact_app:${MONGO_APP_PASSWORD:-intact_pass}@mongodb:27017/intact?authSource=intact
    networks:
      - montimage-network
      - kind # reach the local kind API at https://secsim-e2e-control-plane:6443

volumes:
  mongodb_data:
    name: montimage-mongodb-data-v2
  app_data:
    name: montimage-app-data-v2

networks:
  montimage-network:
  kind:
    external: true # created by `kind create cluster --name secsim-e2e`

include:
  - local: .gitlab/ci/secure-container-pipeline.yml
  - template: Security/SAST.gitlab-ci.yml

image: node:22-bookworm-slim

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        COSIGN_REQUIRED: "false"
    - if: $CI_COMMIT_TAG
      variables:
        COSIGN_REQUIRED: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        COSIGN_REQUIRED: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        COSIGN_REQUIRED: "false"
    - if: $CI_COMMIT_BRANCH
      variables:
        COSIGN_REQUIRED: "false"

stages:
  - quality
  - typecheck
  - test
  - build
  - security
  - report

.secsim_change_paths: &secsim_change_paths
  - .gitlab/**/*
  - .gitlab-ci.yml
  - client/**/*
  - server/**/*
  - docker/**/*
  - k8s/**/*
  - package.json
  - package-lock.json
  - .dockerignore

.secsim_rules: &secsim_rules
  - if: "$CI_COMMIT_TAG"
    changes: *secsim_change_paths
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *secsim_change_paths
  - if: "$CI_COMMIT_BRANCH"
    changes: *secsim_change_paths

.client_change_paths: &client_change_paths
  - .gitlab/**/*
  - .gitlab-ci.yml
  - client/**/*
  - client/package.json
  - client/package-lock.json
  - client/.dockerignore

.server_change_paths: &server_change_paths
  - .gitlab/**/*
  - .gitlab-ci.yml
  - server/**/*
  - server/package.json
  - server/package-lock.json
  - server/.dockerignore

.client_rules: &client_rules
  - if: "$CI_COMMIT_TAG"
    changes: *client_change_paths
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *client_change_paths
  - if: "$CI_COMMIT_BRANCH"
    changes: *client_change_paths

.server_rules: &server_rules
  - if: "$CI_COMMIT_TAG"
    changes: *server_change_paths
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *server_change_paths
  - if: "$CI_COMMIT_BRANCH"
    changes: *server_change_paths

quality:
  stage: quality
  script:
    - HUSKY=0 npm ci
    - npm run format:check
    - npm run lint
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
    policy: pull-push
  rules: *secsim_rules

typecheck:
  stage: typecheck
  script:
    - HUSKY=0 npm ci
    - npm run typecheck
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
    policy: pull-push
  rules: *secsim_rules

test:
  stage: test
  services:
    - name: mongo:7
      alias: mongo
  variables:
    MONGODB_URI: mongodb://mongo:27017/intact-test
    JWT_SECRET: ci-test-jwt-secret-min-32-characters-long
    ENCRYPTION_KEY: ci-test-encryption-key-16chr
  script:
    - HUSKY=0 npm ci
    - npm run test:server
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
    policy: pull-push
  rules: *secsim_rules

build_server_image:
  extends: .container-build
  variables:
    SERVICE_NAME: server
    DOCKERFILE_PATH: server/Dockerfile
    BUILD_CONTEXT: server
  rules: *server_rules

build_client_image:
  extends: .container-build
  variables:
    SERVICE_NAME: client
    DOCKERFILE_PATH: client/Dockerfile
    BUILD_CONTEXT: client
  rules: *client_rules

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - |
      set -eu
      mkdir -p reports

      GITLEAKS_EXIT_CODE=0
      GITLEAKS_SCOPE="full-history"
      GITLEAKS_LOG_OPTS=""
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ] && [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        GITLEAKS_EXIT_CODE=1
        GITLEAKS_SCOPE="mr-diff"
        GITLEAKS_LOG_OPTS="--log-opts=${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"
      fi

      BASELINE_ARGS=""
      if [ -n "${GITLEAKS_BASELINE_PATH:-}" ] && [ -f "${GITLEAKS_BASELINE_PATH}" ]; then
        BASELINE_ARGS="--baseline-path ${GITLEAKS_BASELINE_PATH}"
      fi

      gitleaks git . --platform gitlab ${GITLEAKS_LOG_OPTS} ${BASELINE_ARGS} \
        --report-format json --report-path reports/gitleaks-report.json \
        --exit-code "${GITLEAKS_EXIT_CODE}" --redact=100
      [ -f reports/gitleaks-report.json ] || printf '[]\n' > reports/gitleaks-report.json

      gitleaks git . --platform gitlab ${GITLEAKS_LOG_OPTS} ${BASELINE_ARGS} \
        --report-format csv --report-path reports/gitleaks-report.csv \
        --exit-code 0 --redact=100

      if [ -f reports/gitleaks-report.csv ] && [ "$(wc -l < reports/gitleaks-report.csv)" -gt 1 ]; then
        echo "Gitleaks (${GITLEAKS_SCOPE}) findings preview (rule,file,line,commit):"
        sed -n '1,25p' reports/gitleaks-report.csv
      else
        echo "No gitleaks findings detected in scope: ${GITLEAKS_SCOPE}."
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/gitleaks-report.json
      - reports/gitleaks-report.csv
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

secret_scan_full_history:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - |
      set -eu
      mkdir -p reports
      gitleaks git . --platform gitlab --report-format json \
        --report-path reports/gitleaks-full-report.json --exit-code 0 --redact=100
      [ -f reports/gitleaks-full-report.json ] || printf '[]\n' > reports/gitleaks-full-report.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/gitleaks-full-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

dependency_scan:
  stage: security
  script:
    - |
      set -eu
      mkdir -p reports
      apt-get update >/dev/null
      apt-get install -y --no-install-recommends jq >/dev/null
      rm -rf /var/lib/apt/lists/*
      HUSKY=0 npm ci
      npm audit --json > reports/npm-audit-report.json || true

      AUDIT_TOTAL="$(jq '.metadata.vulnerabilities.total // 0' reports/npm-audit-report.json)"
      AUDIT_HIGH="$(jq '.metadata.vulnerabilities.high // 0' reports/npm-audit-report.json)"
      AUDIT_CRITICAL="$(jq '.metadata.vulnerabilities.critical // 0' reports/npm-audit-report.json)"

      printf 'total=%s\nhigh=%s\ncritical=%s\n' "${AUDIT_TOTAL}" "${AUDIT_HIGH}" "${AUDIT_CRITICAL}" > reports/npm-audit-summary.env

      if [ "${NPM_AUDIT_FAIL_ON_HIGH:-false}" = "true" ] && [ "${AUDIT_HIGH}" -gt 0 ]; then
        echo "npm audit found HIGH severity vulnerabilities: ${AUDIT_HIGH}"
        exit 14
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/npm-audit-report.json
      - reports/npm-audit-summary.env
  rules:
    - if: "$CI_COMMIT_TAG"
      changes: *secsim_change_paths
      variables:
        NPM_AUDIT_FAIL_ON_HIGH: "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *secsim_change_paths
      variables:
        NPM_AUDIT_FAIL_ON_HIGH: "true"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes: *secsim_change_paths
      variables:
        NPM_AUDIT_FAIL_ON_HIGH: "true"
    - if: "$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH"
      changes: *secsim_change_paths
      variables:
        NPM_AUDIT_FAIL_ON_HIGH: "false"

scan_server_image:
  extends: .container-scan
  variables:
    SERVICE_NAME: server
    COSIGN_ATTEST_SBOM: "true"
  needs:
    - job: build_server_image
      artifacts: true
  rules: *server_rules

scan_client_image:
  extends: .container-scan
  variables:
    SERVICE_NAME: client
    COSIGN_ATTEST_SBOM: "true"
  needs:
    - job: build_client_image
      artifacts: true
  rules: *client_rules

verify_image_signatures:
  stage: security
  image: alpine:3.20
  needs:
    - job: scan_server_image
      artifacts: true
      optional: true
    - job: scan_client_image
      artifacts: true
      optional: true
  script:
    - |
      set -eu
      if [ "${COSIGN_REQUIRED:-false}" != "true" ]; then
        echo "COSIGN_REQUIRED is not enabled for this ref; skipping signature enforcement."
        exit 0
      fi
      if ! ls reports/*-cosign-status.env >/dev/null 2>&1; then
        echo "Expected cosign status artifacts were not produced."
        exit 16
      fi
      UNSIGNED_COUNT="$(awk -F= '$1=="status" && $2!="signed" {c++} END {print c+0}' reports/*-cosign-status.env)"
      if [ "${UNSIGNED_COUNT}" -gt 0 ]; then
        echo "Found ${UNSIGNED_COUNT} unsigned container images while signing is required."
        exit 17
      fi
      echo "All scanned images are signed."
  rules:
    - if: "$CI_COMMIT_TAG"
      changes: *secsim_change_paths
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes: *secsim_change_paths

security_findings_overview:
  extends: .security-findings-overview
  needs:
    - job: dependency_scan
      artifacts: true
      optional: true
    - job: secret_scan
      artifacts: true
      optional: true
    - job: secret_scan_full_history
      artifacts: true
      optional: true
    - job: scan_server_image
      artifacts: true
      optional: true
    - job: scan_client_image
      artifacts: true
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: "$CI_COMMIT_TAG"
      changes: *secsim_change_paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *secsim_change_paths
    - if: "$CI_COMMIT_BRANCH"
      changes: *secsim_change_paths

# Development Docker Compose - MongoDB and admin tools only
# Application runs locally with: bun run dev

services:
  mongodb:
    image: mongo:7
    container_name: intact-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: intact
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intact-network

  mongo-express:
    image: mongo-express:latest
    container_name: intact-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - intact-network

  # Optional local Ollama service for agent features.
  # Uncomment if you want Docker-managed Ollama instead of host Ollama.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: intact-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - intact-network

volumes:
  mongodb_data:
    name: intact-mongodb-data
  # ollama_data:
  #   name: intact-ollama-data

networks:
  intact-network:
    driver: bridge

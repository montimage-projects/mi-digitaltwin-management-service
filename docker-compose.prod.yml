# Production Docker Compose - Unified deployment (2 containers)
# Server serves both API and client static files (no CORS issues)
# For development with separate containers, use docker-compose.yml

services:
  mongodb:
    image: mongo:7
    container_name: intact-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: intact
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - intact-network

  app:
    build:
      context: .
      dockerfile: server/Dockerfile.unified
    container_name: intact-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app_data:/app/server/data  # Persist seed marker
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/intact
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - MAESTRO_BASE_URL=${MAESTRO_BASE_URL:-https://maestro.intact-project.eu}
      - SERVE_STATIC=true
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-true}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - intact-network

volumes:
  mongodb_data:
    name: intact-mongodb-data-prod
  app_data:
    name: intact-app-data-prod

networks:
  intact-network:
    driver: bridge

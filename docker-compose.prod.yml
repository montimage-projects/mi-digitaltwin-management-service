# Production Docker Compose - Unified deployment (2 containers)
# Server serves both API and client static files (no CORS issues)
# For development with separate containers, use docker-compose.yml

services:
  mongodb:
    image: mongo:7
    container_name: montimage-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: intact
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - montimage-network

  app:
    build:
      context: .
      dockerfile: server/Dockerfile.unified
    container_name: montimage-app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - app_data:/app/server/data # Persist seed marker
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/intact
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - MAESTRO_BASE_URL=${MAESTRO_BASE_URL:-https://maestro.intact-project.eu}
      - BRANDING_PROFILE=${BRANDING_PROFILE:-secassured}
      - APP_NAME=${APP_NAME:-}
      - ORG_NAME=${ORG_NAME:-}
      - ORG_URL=${ORG_URL:-}
      - SERVE_STATIC=true
      # Opt-in: seeding refuses known-default ADMIN_PASSWORDs. Set a strong
      # ADMIN_PASSWORD (required above), then override SEED_ON_STARTUP=true
      # for the first boot.
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - montimage-network

volumes:
  mongodb_data:
    name: montimage-mongodb-data-prod
  app_data:
    name: montimage-app-data-prod

networks:
  montimage-network:
    driver: bridge

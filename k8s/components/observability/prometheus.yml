# Prometheus for the SecSim platform itself. Shared by the kustomize
# component and docker-compose.prod.yml: in both, the server is reachable as
# `app:3000` and the collector as `otel-collector`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Server RED + Node.js process metrics (server/src/telemetry/metrics.ts).
  # If METRICS_TOKEN is set on the server, add:
  #   authorization: { credentials_file: /etc/prometheus/metrics-token }
  - job_name: secsim-server
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']

  # Span-derived RED metrics and the collector's own health.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  # Headless Service for stable per-Pod StatefulSet DNS
  # (mongodb-0.mongodb.<namespace>.svc.cluster.local).
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb

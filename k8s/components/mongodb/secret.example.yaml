# MongoDB credentials Secret — applied by overlay kustomizations.
# Template: copy to secret.yaml and fill real values.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME_use_openssl_rand_hex_16

# Template for the app Secret — NOT applied by `kubectl apply -k` (it is
# deliberately not listed in any kustomization.yaml resources list, so
# placeholder values can never be applied by accident).
#
# Usage:
#   1. cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#   2. Fill in real values below (secret.yaml is git-ignored, see .gitignore).
#      Prefer your own secret-management tooling in real deployments, e.g.:
#        kubectl create secret generic app-secret \
#          --from-literal=JWT_SECRET=... \
#          --from-literal=ADMIN_PASSWORD=... \
#          --from-literal=ENCRYPTION_KEY=... \
#          --from-literal=MONGODB_URI=... \
#          -n <namespace>
#      or a sealed-secrets / external-secrets operator.
#   3. Create the target namespace first (e.g. kubectl apply -f
#      k8s/overlays/prod/namespace.yaml), then apply the secret into it:
#        kubectl apply -f k8s/base/secret.yaml -n <namespace>
#   4. Only then run `kubectl apply -k k8s/overlays/<variant>`.
#
# See docs/playbooks/kubernetes-deployment.md for the full walkthrough.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Generate with: openssl rand -base64 48 (must be 32+ chars)
  JWT_SECRET: CHANGE_ME_min_32_chars_use_openssl_rand_base64_48
  # Generate with: openssl rand -hex 16 (must be 16+ chars)
  ENCRYPTION_KEY: CHANGE_ME_min_16_chars_use_openssl_rand_hex_16
  # Credentials for the seeded default admin user (change after first login).
  ADMIN_PASSWORD: CHANGE_ME
  # dev/prod overlays (in-cluster MongoDB via the mongodb component): this
  # value is overridden by a Kustomize patch to point at the in-cluster
  # Service, so it does not need to be set correctly here — leave the
  # placeholder.
  # atlas overlay (external MongoDB, no mongodb component): set this to your
  # real connection string, e.g.
  #   mongodb+srv://<user>:<password>@<cluster>.mongodb.net/intact?retryWrites=true&w=majority
  MONGODB_URI: CHANGE_ME
